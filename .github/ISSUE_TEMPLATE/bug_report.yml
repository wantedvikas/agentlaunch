name: Bug report
description: Something in the starter doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. pnpm install\n2. pnpm dev\n3. ..."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "Node 22.x, pnpm 12.x, OS, browser"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any keys, tokens or personal data before pasting.
      render: shell
