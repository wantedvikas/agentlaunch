name: Feature request
description: Suggest an improvement to the Community starter.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked docs/FEATURE_MATRIX.md and this isn't listed as out of scope.
